<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad — Buku Catatan Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark">Notepad</span>
      <span class="sub">Buku Catatan</span>
    </div>
    <button class="new-note-btn" id="btnNewNote">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      Catatan Baru
    </button>
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="sidebarSearch" placeholder="Cari catatan...">
    </div>
    <div class="notes-list" id="notesList"></div>
    <div class="sidebar-footer">Tersimpan otomatis di perangkat ini</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn menu-toggle" id="btnMenu" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="heading">
        <h1>Free Online Notepad</h1>
        <p>Notepad cepat &amp; privat yang hidup di browser Anda. Catatan tersimpan otomatis secara lokal dan tidak pernah meninggalkan perangkat Anda.</p>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnTheme" title="Mode gelap/terang">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <div class="pad-wrap">
      <div class="rings">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="card">
        <div class="toolbar" id="toolbar" style="position:relative;">
          <button data-cmd="bold" title="Tebal (Ctrl+B)"><b>B</b></button>
          <button data-cmd="italic" title="Miring (Ctrl+I)"><i>I</i></button>
          <button data-cmd="h" title="Judul">H</button>
          <button data-cmd="check" title="Checklist">☑</button>
          <button data-cmd="bullet" title="Poin">•</button>
          <button data-cmd="number" title="Bernomor">1.</button>
          <button data-cmd="code" title="Kode">&lt;/&gt;</button>
          <button data-cmd="table" title="Tabel">⊞</button>
          <div class="sep"></div>
          <button id="btnEmoji" title="Emoji">🙂</button>
          <button id="btnSearchTxt" title="Cari &amp; ganti">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <div class="spacer"></div>
          <div class="view-toggle">
            <button id="btnEdit" class="active">Edit</button>
            <button id="btnPreview">Preview</button>
          </div>

          <div class="emoji-pop" id="emojiPop"><div class="emoji-grid" id="emojiGrid"></div></div>
          <div class="search-pop" id="searchPop">
            <input type="text" id="findInput" placeholder="Cari teks dalam catatan...">
          </div>
        </div>

        <div class="editor-area">
          <div class="ruled">
            <div class="margin-rule"></div>
            <textarea id="editor" spellcheck="true" placeholder="Tulis catatan Anda di sini... gunakan Markdown ✍️"></textarea>
          </div>
          <div id="preview"></div>
        </div>

        <div class="statusbar">
          <span id="wordCount">0 kata</span>
          <span id="charCount">0 karakter</span>
          <span id="lineCount">1 baris</span>
          <div class="spacer"></div>
          <div class="action-links">
            <button id="btnTxt">⬇ Unduh .txt</button>
            <button id="btnMd">⬇ Unduh .md</button>
            <button id="btnCopy">📋 Salin</button>
            <button id="btnPrint">🖨 Cetak / Simpan PDF</button>
            <button id="btnClear" class="danger">🗑 Hapus isi</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="print-area">
  <h1 class="print-title" id="printTitle"></h1>
  <div class="print-meta" id="printMeta"></div>
  <div class="print-body" id="printBody"></div>
</div>

<div class="toast" id="toast"></div>


<script src="script.js"></script>
</body>
</html>
